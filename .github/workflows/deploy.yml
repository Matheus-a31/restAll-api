name: Deploy Spring Boot to EC2

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn clean test

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ec2-user/app/"
          strip_components: 1

      - name: Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD
          script: |
            # Para a aplicação antiga (se existir)
            pkill -f 'java -jar' || true
            sleep 2

            # Remove JARs antigos para evitar acúmulo de lixo
            cd /home/ec2-user/app
            find . -maxdepth 1 -name "*.jar" -mtime +0 -delete || true

            # Exporta variáveis de ambiente para o Spring Boot
            export SPRING_DATASOURCE_URL="$DB_URL"
            export SPRING_DATASOURCE_USERNAME="$DB_USERNAME"
            export SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD"

            # Inicia a aplicação
            nohup java -jar *.jar > app.log 2>&1 &
            sleep 15

            # Mostra as últimas linhas do log para diagnóstico
            tail -n 30 app.log
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
